# Document root for the restructured layout.
#
# Only public/ is web-served. app/, database/, docs/, vendor/ and the
# repository root stay outside the document root and are unreachable over HTTP.
<VirtualHost *:80>
    ServerAdmin webmaster@localhost
    DocumentRoot /var/www/html/public

    <Directory /var/www/html/public>
        Options -Indexes -ExecCGI
        AllowOverride None
        Require all granted
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
