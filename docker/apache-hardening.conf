# Request limits
LimitRequestBody 1048576

# This application performs no file uploads: reject multipart outright.
RewriteEngine On
RewriteCond %{CONTENT_TYPE} ^multipart/form-data [NC]
RewriteRule ^ - [R=415,L]

<Directory /var/www/html>
    Options -Indexes -ExecCGI
    AllowOverride None
    Require all granted
    <FilesMatch "\.(ini|log|sql|md|sh|bak|env|sqlite)$">
        Require all denied
    </FilesMatch>
</Directory>

ServerTokens Prod
ServerSignature Off
TraceEnable Off
