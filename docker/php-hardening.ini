; PHP2Shell interim mitigations + general hardening
; See docs/fix/php2shell-and-bugfix-plan.md §6.3

; CVE-2026-109619: upload-progress path
session.upload_progress.enabled = Off
session.upload_progress.cleanup = On
; PHP 8.5 only; ignored harmlessly on older branches
fatal_error_backtraces = Off

; OPcache type-confusion primitive (CVE-2026-109619)
opcache.enable = 0
opcache.enable_cli = 0

; This application performs zero file uploads (no $_FILES /
; move_uploaded_file / is_uploaded_file anywhere in the codebase).
file_uploads = Off
upload_max_filesize = 0

; Shrink the attack surface of the request parser
post_max_size = 1M
max_input_vars = 500
max_input_nesting_level = 64
max_input_time = 30
max_execution_time = 60

; Do not expose internals
expose_php = Off
display_errors = Off
display_startup_errors = Off
log_errors = On
html_errors = Off
allow_url_include = Off
allow_url_fopen = Off

; Session hardening
session.use_strict_mode = 1
session.use_only_cookies = 1
session.cookie_httponly = 1
session.cookie_samesite = Lax
session.cookie_secure = 1
session.sid_length = 48
session.sid_bits_per_character = 6
session.save_path = "/var/lib/php/sessions"

; Contain filesystem access (includes CA bundle for PHPMailer SMTP over TLS)
open_basedir = /var/www/html:/var/lib/php/sessions:/tmp:/etc/ssl/certs:/usr/share/ca-certificates

; The application uses none of these (verified by grep).
; Do not disable fsockopen/curl — PHPMailer needs them for Gmail SMTP.
disable_functions = exec,shell_exec,system,passthru,proc_open,popen,pcntl_exec,pcntl_fork,dl,putenv

; CVE-2026-109618: the exploit needs a PHP-level allocation failure.
; Only enable this when the container has a hard memory cap (e.g. --memory=512m),
; so the cgroup kills the container instead of PHP running cleanup on corrupt state.
; memory_limit = -1
